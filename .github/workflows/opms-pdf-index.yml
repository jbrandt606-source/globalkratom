name: Index OPMS court PDFs
on:
  push:
    branches: [main]
    paths:
      - 'opms/pdfs/**'
      - 'scripts/build_opms_index.py'
      - '.github/workflows/opms-pdf-index.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: opms-pdf-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF and OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install --upgrade pip
          python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Build page-level index
        run: python scripts/build_opms_index.py --root . --ocr auto
      - name: Commit search data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A opms/search-data/
          if git diff --cached --quiet; then
            echo 'No index changes'
          else
            git commit -m 'Update OPMS PDF full-text index [skip ci]'
            git push
          fi
